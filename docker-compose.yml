services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atozee
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: atozee
    ports:
      - "5432:5432"
    volumes:
      - atozee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atozee -d atozee"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # MinIO's own env var names — these are what actually get read by the
      # minio server process. They must match MINIO_ACCESS_KEY / MINIO_SECRET_KEY
      # in .env.local, since that's what the app authenticates with.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - atozee_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atozee_postgres_data:
  atozee_minio_data:
